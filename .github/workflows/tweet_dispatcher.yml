name: Tweet Dispatcher

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tweegen-state-writer
  queue: max

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Checkout automation state
        uses: actions/checkout@v4
        with:
          ref: automation-state
          path: state_repo
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt

      - name: Dispatch at most one tweet
        id: dispatcher
        working-directory: app
        env:
          STATE_DIR: ../state_repo/logs
          LOCAL_TIMEZONE: Asia/Kolkata
          MIN_TWEET_GAP_MINUTES: "30"

          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_API_URL: https://api.buffer.com
        run: python -m runners.tweet_dispatcher

      - name: Commit posted state
        if: steps.dispatcher.outputs.posted == 'true'
        working-directory: state_repo
        run: |
          git config user.name "tweegen-bot"
          git config user.email "tweegen-bot@users.noreply.github.com"

          git add logs/

          if git diff --cached --quiet; then
            echo "No posted-state change to commit."
          else
            git commit -m "state: posted tweet run $GITHUB_RUN_ID"
            git push origin automation-state
          fi
